<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reserva de Horas Médicas - Clínica Inatrans Salud</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h1>Clínica Inatrans Salud</h1>
            <p>Sistema Web de Reserva de Horas Médicas - Entorno DevOps</p>
        </header>

        <main class="container">
            <section class="status-card">
                <h2>Estado del Servicio</h2>
                <p><span class="status-indicator"></span> Servicio Operativo (Ngnix / Docker)</p>
                <p><strong>Ambiente:</strong> Local / Controlado</p>
            </section>

            <section class="form-section">
                <h2>Formulario de Solicitud de Cita</h2>
                <form onsubmit="event.preventDefault(); alert('¡Solicitud de reserva registrada con éxito!');">
                    <div class="form-group">
                        <label for="nombre">Nombre Completo del Paciente:</label>
                        <input type="text" id="nombre" name="nombre" required placeholder="Ej. Juan Pérez">
                    </div>
                
                    <div class="form-group">
                        <label for="rut">RUT / Identificación:</label>
                        <input type="text" id="rut" name="rut" required placeholder="Ej. 12.345.678-9">
                    </div>

                    <div class="form-group">
                        <label for="especialidad">Especialidad Médica:</label>
                        <select id="especialidad" name="especialidad" required>
                            <option value="">Seleccione una especialidad</option>
                            <option value="medicina-general">Medicina General</option>
                            <option value="pediatria">Pediatría</option>
                            <option value="cardiologia">Cardiología</option>
                            <option value="oftalmologia">Oftalmología</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="fecha">Fecha Preferida:</label>
                        <input type="date" id="fecha" name="fecha" required>
                    </div>

                    <button type="submit" class="btn-submit">Confirmar Reserva</button>
                </form>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Inatrans Servicios Spa - Área Tecnologías de la Salud. Todos los derechos reservados</p>
        </footer>
    </body>
</html>
